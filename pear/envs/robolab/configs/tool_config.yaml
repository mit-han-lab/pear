# Tool config for actor_rollout_ref.rollout.multi_turn.tool_config_path: the RoboLab environment family (its
# conversation, its trajectories' sessions on the run's servers); the config dict reaches EnvironmentTool. Its variables
# are resolved by OmegaConf when the file is loaded.
tools:
  - class_name: pear.envs.tool.EnvironmentTool
    config:
      type: native
      env_class: pear.envs.robolab.env.RoboLabEnv  # the family: its facts and its simulator
      server_n: ${oc.env:ROBOLAB_SERVER_N}        # a GPU of a simulator machine each (the recipe's ROBOLAB_SERVER_N)
      apps_per_gpu: ${oc.env:ROBOLAB_APPS_PER_GPU,10}  # a server's Apps, an episode each (the recipe's ROBOLAB_APPS_PER_GPU)
      log_dir: ${oc.env:PEAR_LOG_DIR}              # the servers' logs and the tool's call log (the recipe: $RUN/sim)
