name: Server tests

# The model server (pear/deploy/server): its test in the environment of its install target, whose vLLM is the server's
# own and not the training environment's. It runs when the server, what it imports of the rest of PEAR or its install
# target changes, and on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "pear/deploy/server/**"
      - "pear/configs/server.yaml"
      - "pear/models/**"
      - "pear/utils/**"
      - "tests/deploy/test_deploy_server_on_cpu.py"
      - "tests/*.py"
      - "scripts/install.sh"
      - "scripts/install/common.sh"
      - "scripts/install/download.sh"
      - "scripts/install/versions.env"
      - "scripts/install/server/**"
      - "pyproject.toml"
      - ".github/workflows/server.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bash with -e and pipefail: a step ends at the first command that fails, inside a pipeline too
defaults:
  run:
    shell: bash

jobs:
  tests:
    name: The server's test, with stand-in kernels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The server's environment and the installer's uv, from the cache when the installer and its pins are unchanged
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/pear/bin
            ${{ runner.temp }}/pear/envs
          key: server-env-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install.sh', 'scripts/install/server/**', 'scripts/install/common.sh', 'scripts/install/download.sh', 'scripts/install/versions.env', 'pyproject.toml') }}
      - name: Install it otherwise
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          WORK_DIR: ${{ runner.temp }}/pear
        run: bash scripts/install.sh server
      # the server's test: the file the training environment's runners leave out
      - run: $RUNNER_TEMP/pear/envs/server/bin/python -m pytest tests/deploy/test_deploy_server_on_cpu.py
