name: Tinker

on:
  push:
    branches: [main, tinker-backend]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: WORK_DIR="$RUNNER_TEMP/pear" bash scripts/install.sh tinker
      - run: >-
          "$RUNNER_TEMP/pear/bin/uv" pip install --python "$RUNNER_TEMP/pear/envs/tinker/bin/python"
          --constraint scripts/install/tinker/constraints.txt pytest pytest-asyncio ruff==0.16.9
      - run: echo "$RUNNER_TEMP/pear/envs/tinker/bin" >> "$GITHUB_PATH"
      - run: ruff check pear/backends tests/backends
      - run: ruff format --check pear/backends tests/backends
      - run: >-
          python -m pytest tests/backends tests/test_layering_on_cpu.py tests/test_repository_hygiene_on_cpu.py
          tests/docs/test_documents_on_cpu.py
          tests/scripts/test_installer_on_cpu.py tests/scripts/test_installer_pins_on_cpu.py
          tests/scripts/test_start_ray_node_on_cpu.py
      - run: python -m pytest tests/envs/test_environment_tool_on_cpu.py -k 'not verl'
      - run: python -m pear.backends.tinker check --config examples/tinker/stage1.yaml
