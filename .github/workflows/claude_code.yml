name: Claude Code tests

# The Claude Code session service (pear/deploy/harness/claude_code): its tests, in the environment of its install
# target, with the Claude Code CLI its Agent SDK carries and a stand-in model server. They run when the service, the
# station's client whose protocol it answers, what it imports of the rest of PEAR or its install target changes, and
# on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "pear/deploy/harness/claude_code/**"
      - "pear/deploy/station/agent_loop/clients/**"
      - "pear/deploy/station/exceptions.py"
      - "pear/configs/claude_code.yaml"
      - "pear/utils/**"
      - "tests/deploy/harness/claude_code/**"
      - "tests/*.py"
      - "scripts/install.sh"
      - "scripts/install/common.sh"
      - "scripts/install/download.sh"
      - "scripts/install/versions.env"
      - "scripts/install/claude_code/**"
      - "pyproject.toml"
      - ".github/workflows/claude_code.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bash with -e and pipefail: a step ends at the first command that fails, inside a pipeline too
defaults:
  run:
    shell: bash

jobs:
  tests:
    name: The service's tests, with a stand-in model server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The service's environment and the installer's uv, from the cache when the installer and its pins are unchanged
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/pear/bin
            ${{ runner.temp }}/pear/envs
          key: claude-code-env-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install.sh', 'scripts/install/claude_code/**', 'scripts/install/common.sh', 'scripts/install/download.sh', 'scripts/install/versions.env', 'pyproject.toml') }}
      - name: Install it otherwise
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          WORK_DIR: ${{ runner.temp }}/pear
        run: bash scripts/install.sh claude_code
      # the service's tests: the directory the training environment's runners leave out
      - run: $RUNNER_TEMP/pear/envs/claude_code/bin/python -m pytest tests/deploy/harness/claude_code
